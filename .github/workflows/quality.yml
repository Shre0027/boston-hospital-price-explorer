name: Fetch quality ratings

# Run by hand: download CMS hospital star ratings for Massachusetts (scripts/fetch_quality.py)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_quality.py
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quality
          git commit -m "Update CMS quality ratings" || echo "Nothing changed"
          git pull --rebase
          git push
