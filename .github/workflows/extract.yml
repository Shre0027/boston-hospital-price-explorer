name: Extract hospital prices

# Run by hand from the Actions tab: one or more hospital ids from config/hospitals.json
on:
  workflow_dispatch:
    inputs:
      hospital:
        description: "Hospital id(s) from config/hospitals.json, space-separated"
        required: true
        default: "mgh"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the streaming JSON reader
        run: pip install ijson

      - name: Download and extract prices
        # One hospital failing doesn't stop the others; its previous results are kept
        run: |
          failed=""
          for h in ${{ inputs.hospital }}; do
            echo "::group::$h"
            python scripts/extract_prices.py --hospital "$h" || failed="$failed $h"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::warning::Failed:$failed"; fi

      - name: Keep the results as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: extract-results
          path: data/processed/

      - name: Save results to the repo (files over GitHub's size limit are kept as the artifact only)
        run: |
          for f in data/processed/*_prices.csv data/processed/*_profile.json; do
            [ -f "$f" ] || continue
            size=$(stat -c%s "$f")
            if [ "$size" -gt 90000000 ]; then echo "::warning::$f is too large to commit"; else git add "$f"; fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update extracted prices: ${{ inputs.hospital }}" || echo "Nothing changed"
          git pull --rebase
          git push
